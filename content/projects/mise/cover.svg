    <path class="ink" d="M536 134 L616 136 L614 190 L538 188 Z" />
  </g>

  <text x="93" y="166" text-anchor="middle" font-size="20">core</text>
  <text x="93" y="190" text-anchor="middle" class="dim">fastapi</text>
  <text x="266" y="226" text-anchor="middle" font-size="16" class="hl">rabbitmq</text>
  <text x="432" y="160" text-anchor="middle" font-size="18">workers</text>
  <text x="432" y="184" text-anchor="middle" class="dim">0–10, keda</text>
  <text x="576" y="168" text-anchor="middle" font-size="16">redis</text>
