      <path class="ink" d="M1 1 L8 5 L1 9" />
    </marker>
    <marker id="mise-cover-hltip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="hl" d="M1 1 L8 5 L1 9" />
    </marker>
  </defs>

  <g>
    <path class="ink" d="M24 130 L160 128 L162 206 L26 208 Z" />
    <path class="ink" d="M166 168 L192 168" marker-end="url(#mise-cover-tip)" />
    <path class="hl fill-hl" stroke-width="2.5" d="M200 142 L330 140 L332 196 L202 198 Z" />
    <path class="hl" d="M234 144 L234 194 M266 142 L266 196 M298 142 L298 196" stroke-width="1" />
    <path class="ink" d="M336 168 L362 168" marker-end="url(#mise-cover-tip)" />
    <path class="dim" d="M394 100 L514 102 L512 150" stroke-dasharray="5 6" />
    <path class="dim" d="M382 110 L504 112 L502 150" stroke-dasharray="5 6" />
