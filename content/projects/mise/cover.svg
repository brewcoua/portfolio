<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 336" role="img" aria-label="The core server enqueues jobs on RabbitMQ; ML and LLM workers scaled by KEDA from 0 to 10 replicas pick them up and write results to Redis">
