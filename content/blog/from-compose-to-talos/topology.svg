<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-label="Two Hetzner nodes, ogma as edge and control plane and kenaz as worker, joined by KubeSpan; laptops and a Raspberry Pi at home are dashed as next to join; NetBird devices reach private services through a routing peer">
