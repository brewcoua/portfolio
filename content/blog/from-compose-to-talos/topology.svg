    <path class="hl" d="M362 108 C 380 96, 396 96, 412 106" stroke-dasharray="5 6" marker-end="url(#from-compose-to-talos-topology-hltip)" />

    <path class="ink" d="M44 256 L194 254 L196 306 L42 308 Z" />
    <path class="ink" d="M200 280 C 260 280, 290 230, 292 162" marker-end="url(#from-compose-to-talos-topology-tip)" />
