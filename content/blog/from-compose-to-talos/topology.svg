  <text x="124" y="30" class="dim">internet</text>
  <text x="200" y="64" text-anchor="middle" class="dim">hetzner</text>
  <text x="114" y="114" text-anchor="middle" font-size="16">ogma</text>
  <text x="114" y="136" text-anchor="middle" class="dim">edge, control</text>
  <text x="290" y="114" text-anchor="middle" font-size="16">kenaz</text>
  <text x="290" y="136" text-anchor="middle" class="dim">worker</text>
