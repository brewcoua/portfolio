  <text x="320" y="102" text-anchor="middle" font-size="16" class="hl">mind</text>
  <text x="320" y="124" text-anchor="middle" class="dim" font-size="13">gpt-4o reasons</text>
  <text x="535" y="102" text-anchor="middle" font-size="16">act</text>
  <text x="535" y="124" text-anchor="middle" class="dim" font-size="13">playwright</text>
  <text x="320" y="182" text-anchor="middle" class="dim" font-size="13">next cycle</text>
  <text x="330" y="258" class="dim" font-size="13">when done</text>
  <text x="320" y="297" text-anchor="middle" font-size="16">evaluation</text>
